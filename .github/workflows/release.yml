name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The suite drives a real tmux server, so the runner needs one before it
      # can say whether this tag is worth publishing.
      - run: sudo apt-get update && sudo apt-get install -y tmux

      - run: go vet ./...
      - run: go test ./...

      - run: scripts/build-release.sh "${GITHUB_REF_NAME}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
